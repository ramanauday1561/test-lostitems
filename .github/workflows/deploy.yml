name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: lost-items-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lost-items-app/package-lock.json

      - run: npm ci

      # expo export writes expo-env.d.ts, which tsconfig includes; typecheck
      # must therefore run after the export, not before it.
      - name: Build static web bundle
        run: npx expo export -p web

      - run: npm run typecheck

      - name: SPA fallback and custom domain
        run: |
          cp dist/index.html dist/404.html
          printf 'test.lostitemscommunity.com' > dist/CNAME
          test -s dist/CNAME && cat dist/CNAME && echo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lost-items-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
